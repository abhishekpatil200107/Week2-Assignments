<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar__in">
      <h1>Employee Management</h1>
      <button class="btn btn--primary" id="add-btn" type="button">+ Add Employee</button>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" aria-label="Summary">
      <div class="stat"><span id="stat-count">–</span><small>Employees shown</small></div>
      <div class="stat"><span id="stat-avg">–</span><small>Average salary</small></div>
      <div class="stat"><span id="stat-depts">–</span><small>Departments</small></div>
    </section>

    <section class="toolbar" aria-label="Search and filter">
      <label class="sr-only" for="search">Search employees</label>
      <input id="search" type="search" placeholder="Search by name, role or department…" autocomplete="off">
      <label class="sr-only" for="dept-filter">Filter by department</label>
      <select id="dept-filter"><option value="">All departments</option></select>
    </section>

    <div id="alert" class="alert" role="alert" hidden></div>

    <div class="table-wrap">
      <table id="emp-table">
        <caption class="sr-only">Employee records. Click a column heading to sort.</caption>
        <thead>
          <tr>
            <th scope="col" aria-sort="none"><button class="sort" data-sort="name" type="button">Name</button></th>
            <th scope="col" aria-sort="none"><button class="sort" data-sort="department" type="button">Department</button></th>
            <th scope="col" aria-sort="none"><button class="sort" data-sort="role" type="button">Role</button></th>
            <th scope="col" aria-sort="none" class="num"><button class="sort" data-sort="salary" type="button">Salary</button></th>
            <th scope="col" aria-sort="none"><button class="sort" data-sort="join_date" type="button">Join date</button></th>
            <th scope="col" class="actions-col">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="loading" class="state" hidden><span class="spinner" aria-hidden="true"></span> Loading employees…</div>
      <div id="empty" class="state" hidden></div>
    </div>
  </main>

  <!-- Add / Edit modal -->
  <dialog id="form-dialog" aria-labelledby="form-title">
    <form id="emp-form" novalidate>
      <h2 id="form-title">Add Employee</h2>
      <input type="hidden" id="emp-id">

      <div class="field"><label for="f-name">Full name</label>
        <input id="f-name" name="name" type="text" maxlength="100" autocomplete="off" required>
        <p class="err" id="e-name"></p></div>

      <div class="row">
        <div class="field"><label for="f-department">Department</label>
          <input id="f-department" name="department" type="text" list="dept-list" maxlength="50" autocomplete="off" required>
          <datalist id="dept-list"></datalist>
          <p class="err" id="e-department"></p></div>
        <div class="field"><label for="f-role">Role</label>
          <input id="f-role" name="role" type="text" maxlength="80" autocomplete="off" required>
          <p class="err" id="e-role"></p></div>
      </div>

      <div class="row">
        <div class="field"><label for="f-salary">Annual salary (₹)</label>
          <input id="f-salary" name="salary" type="number" min="1" step="1" inputmode="numeric" required>
          <p class="err" id="e-salary"></p></div>
        <div class="field"><label for="f-join_date">Join date</label>
          <input id="f-join_date" name="join_date" type="date" required>
          <p class="err" id="e-join_date"></p></div>
      </div>

      <p class="err err--form" id="e-form" role="alert"></p>
      <div class="dialog-actions">
        <button class="btn" type="button" id="cancel-btn">Cancel</button>
        <button class="btn btn--primary" type="submit" id="save-btn">Save</button>
      </div>
    </form>
  </dialog>

  <!-- Delete confirmation modal -->
  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <h2 id="delete-title">Delete employee?</h2>
    <p id="delete-text"></p>
    <p class="err err--form" id="e-delete" role="alert"></p>
    <div class="dialog-actions">
      <button class="btn" type="button" id="delete-cancel">Cancel</button>
      <button class="btn btn--danger" type="button" id="delete-confirm">Delete</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
